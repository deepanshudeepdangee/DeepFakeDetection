<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Deepfake Detection{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container mx-auto">
            <div class="flex justify-between items-center">
                <a href="/" class="text-xl font-bold text-gradient">DeepDetect</a>
                <div class="nav-links">
                    <a href="/" class="nav-link {% if request.endpoint == 'home' %}active{% endif %}">Home</a>
                    <a href="/detect" class="nav-link {% if request.endpoint == 'detect' %}active{% endif %}">Detect</a>
                    <a href="/about" class="nav-link {% if request.endpoint == 'about' %}active{% endif %}">About</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <p>&copy; 2024 DeepDetect. All rights reserved.</p>
                <div class="flex space-x-4 mt-4 md:mt-0">
                    <a href="/" class="text-gray-300 hover:text-primary-light transition-colors">Privacy Policy</a>
                    <a href="/" class="text-gray-300 hover:text-primary-light transition-colors">Terms of Service</a>
                    <a href="/about" class="text-gray-300 hover:text-primary-light transition-colors">Contact</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Enhanced JavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    <script>
        // Add scroll effect to navbar
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // Add smooth scrolling for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Add loading animation for page transitions
        document.addEventListener('DOMContentLoaded', () => {
            // Add fade-in animation to main content
            const main = document.querySelector('main');
            if (main) {
                main.style.opacity = '0';
                main.style.animation = 'fadeInUp 0.6s ease-out forwards';
            }
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
